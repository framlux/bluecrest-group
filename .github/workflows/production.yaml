on:
  workflow_dispatch:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: framlux/bluecrest/web:latest
          secrets: |
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
            TURNSTILE_SECRET=${{ secrets.TURNSTILE_SECRET }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          build-args: |
            NEXT_PUBLIC_SANITY_DATASET=${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
            SENDGRID_TEMPLATE_ID=${{ vars.SENDGRID_TEMPLATE_ID }}
            SENDGRID_TEMPLATE_CONFIRMATION=${{ vars.SENDGRID_TEMPLATE_CONFIRMATION }}
            SENDGRID_REPLY_TO=${{ vars.SENDGRID_REPLY_TO }}
            SENDGRID_FROM_EMAIL=${{ vars.SENDGRID_FROM_EMAIL }}
            SENDGRID_FROM_NAME=${{ vars.SENDGRID_FROM_NAME }}